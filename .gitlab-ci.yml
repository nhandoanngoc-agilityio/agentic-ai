stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

test:
  stage: test
  image: python:3.11-slim
  # TEMPORARY: skip CI on langsmith-eval-upgrade while the eval work is in
  # progress. Remove this rules block once the branch is ready again.
  rules:
    - if: '$CI_COMMIT_REF_NAME == "langsmith-eval-upgrade"'
      when: never
    - when: on_success
  before_script:
    - pip install --upgrade pip
    - pip install -e ".[dev]"
  script:
    - ruff check src tests scripts
    - pytest -q
