# Hermetic checks only: no API keys, no network calls from tests, no seeded
# vector store. The paid eval gate (scripts/run_evals.py) stays manual.
# Reproduce this job locally before pushing: scripts/ci_local.sh
stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

test:
  stage: test
  image: python:3.11-slim
  before_script:
    # The venv lives at ./.venv because [tool.pyright] in pyproject.toml points
    # basedpyright there, the same as a local checkout.
    - python -m venv .venv
    - . .venv/bin/activate
    - pip install --upgrade pip
    # CPU-only torch first, so sentence-transformers doesn't pull CUDA wheels.
    - pip install torch --index-url https://download.pytorch.org/whl/cpu
    # prod too: the Postgres checkpointer code is type-checked, and its imports
    # must resolve (with dev only, basedpyright reports them as missing).
    - pip install -e ".[dev,prod]"
  script:
    - bash scripts/ci_checks.sh
  artifacts:
    when: always
    reports:
      junit: report.xml
