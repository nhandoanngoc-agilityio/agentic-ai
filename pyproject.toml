[project]
name = "market-research-analyst-team"
version = "0.1.0"
description = "Multi-agent LangGraph demo: supervised research, analytics, and reporting agents with MCP tool integration"
requires-python = ">=3.11"
dependencies = [
    # --- Graph orchestration ---
    "langgraph>=1.2.9,<2.0",
    "langgraph-checkpoint>=2.0",          # base checkpointer interfaces
    "langgraph-checkpoint-sqlite>=2.0",   # local/dev durable checkpointing

    # --- LangChain core + model provider ---
    "langchain>=1.3.14,<2.0",
    "langchain-core>=0.4",
    "langchain-anthropic>=0.4",           # Claude as the driving LLM
    "langchain-text-splitters>=0.4",      # recursive/hierarchical chunking (Day 3)

    # --- Retrieval / vector store / reranking ---
    "langchain-chroma>=0.3",
    "chromadb>=0.6",
    "sentence-transformers>=3.3",         # embeddings + CrossEncoder reranker (Day 4-5)

    # --- Analytics agent tools ---
    "numpy>=2.1",
    "pandas>=2.2",

    # --- MCP integration (Day 8-9) ---
    "mcp>=1.28,<2.0",                     # official MCP Python SDK -- stay on v1.x, v2 is alpha
    "langchain-mcp-adapters>=0.2.1",      # wraps MCP tools as LangChain/LangGraph tools

    # --- Ingestion utilities ---
    "pypdf>=5.1",
    "tiktoken>=0.8",

    # --- Config / app scaffolding ---
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
prod = [
    "langgraph-checkpoint-postgres>=3.0.5",  # prod checkpointer
    "psycopg[binary]>=3.2",
]
dev = [
    "langgraph-cli[inmem]>=0.4.31",          # `langgraph dev` for LangGraph Studio (Day 10)
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_research_team"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
