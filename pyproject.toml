[project]
name = "market-research-analyst-team"
version = "0.1.0"
description = "Multi-agent LangGraph demo: supervised research, analytics, and reporting agents with MCP tool integration"
requires-python = ">=3.11"
dependencies = [
    # --- Graph orchestration ---
    "langgraph>=1.2.9,<2.0",
    "langgraph-checkpoint>=2.0",          # base checkpointer interfaces
    "langgraph-checkpoint-sqlite>=2.0",   # local/dev durable checkpointing

    # --- LangChain core + model provider ---
    "langchain>=1.3.14,<2.0",
    "langchain-core>=0.4",
    "langchain-anthropic>=0.4",           # Claude provider
    "langchain-openai>=1.4.1",             # OpenAI provider (LLM_PROVIDER=openai)
    "langchain-text-splitters>=0.4",      # recursive/hierarchical chunking
    "langsmith>=0.6,<1.0",                # LangSmith client: tracing + eval datasets/experiments

    # --- Retrieval / vector store / reranking ---
    "langchain-chroma>=0.3",
    "chromadb>=0.6",
    "sentence-transformers>=3.3",         # embeddings + CrossEncoder reranker
    "langchain-huggingface>=1.2.2",       # LangChain Embeddings wrapper over sentence-transformers

    # --- Analytics agent tools ---
    "numpy>=2.1",
    "pandas>=2.2",

    # --- MCP integration ---
    "mcp>=1.28,<2.0",                     # official MCP Python SDK -- stay on v1.x, v2 is alpha
    "langchain-mcp-adapters>=0.2.1",      # wraps MCP tools as LangChain/LangGraph tools
    "langfuse>=3.0",                      # optional tracing; no-ops when unconfigured

    # --- Ingestion utilities ---
    "pypdf>=5.1",
    "tiktoken>=0.8",

    # --- Config / app scaffolding ---
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",

    #--- UI / visualization ---
    "gradio>=6.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
prod = [
    "langgraph-checkpoint-postgres>=3.0.5",  # prod checkpointer
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",                     # pooled connections for the shared checkpointer
]
dev = [
    "langgraph-cli[inmem]>=0.4.31",          # `langgraph dev` for LangGraph Studio
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",                       # `pytest --cov` coverage report
    "ruff>=0.8",
    "basedpyright>=1.31",                    # type checker; bundles its own Node, see [tool.pyright]
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_research_team", "gradio_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["market_research_team", "gradio_app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Floor one point under the level when coverage was adopted (94%, 2026-10-06).
fail_under = 93
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

# Read by both basedpyright (CLI) and Pylance (VS Code). Errors that existed when
# checking was adopted are recorded in .basedpyright/baseline.json and fixed over
# time; `basedpyright` fails only on new ones. Refresh it after fixing some:
# `basedpyright --writebaseline`.
[tool.pyright]
include = ["src", "scripts", "gradio_app", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "gradio_app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
